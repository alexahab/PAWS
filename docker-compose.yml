services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paws_db
      POSTGRES_USER: paws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paws_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paws_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paws -d paws_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  paws_postgres_data:
