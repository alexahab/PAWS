{% extends 'base.html' %}{% block content %}<div class="form-panel panel"><h1>{{ 'Редактировать объявление' if ad else 'Новое объявление' }}</h1><p class="muted">После отправки объявление проверит модератор.</p><form method="post" enctype="multipart/form-data" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="two"><label>Тип заявки<select name="kind" required><option value="lost" {% if ad and ad.kind=='lost' %}selected{% endif %}>Пропал</option><option value="found" {% if ad and ad.kind=='found' %}selected{% endif %}>Найден</option></select></label><label>Кличка (если известна)<input name="animal_name" maxlength="80" value="{{ ad.animal_name if ad else '' }}"></label></div><div class="two"><label>Вид животного<input name="species" required maxlength="60" placeholder="Кошка, собака…" value="{{ ad.species if ad else '' }}"></label><label>Город<input name="city" required maxlength="100" value="{{ ad.city if ad else '' }}"></label></div><label>Район / место<input name="district" required maxlength="100" value="{{ ad.district if ad else '' }}"></label><label>Описание (20–300 символов)<textarea name="description" required minlength="20" maxlength="300" rows="5" placeholder="Приметы, обстоятельства, дата…">{{ ad.description if ad else '' }}</textarea></label><label>Контакт для связи<input name="contact" required minlength="5" maxlength="150" value="{{ ad.contact if ad else '' }}" placeholder="Телефон, email или мессенджер"></label><label>Фотография (JPG/PNG/WEBP, до 5 МБ)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" {% if not ad %}required{% endif %}></label>{% if ad %}<p class="muted">Если фото не выбрано, сохранится прежнее.</p>{% endif %}<button class="btn">{{ 'Сохранить изменения' if ad else 'Отправить на модерацию' }}</button></form></div>{% endblock %}
